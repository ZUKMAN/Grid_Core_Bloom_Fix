; Grid_Core_Bloom_Fix - Race Driver: GRID
; Put this file next to dinput8.dll in the game folder.

[Threads]
; The engine is told it has 4 CPUs (2/1 on small CPUs) and always uses the game's own
; workerMap4Core.xml. GRID never pins threads hard, it only sets an "ideal processor".

; 1 = map ideal processors to the best physical cores (P-cores, no HT siblings)
; 0 = no ideal processor at all, let Windows schedule
; 2 = original game behaviour (core % CPU count)
Affinity=1

; 1 = redirect system/workerMap*.xml to the game's 4/2/1 core map for this CPU
; 0 = use whatever the game picked (hardware_settings_restrictions.xml picks 2Core on any
;     Intel CPU because of the "hyperThreading" rule)
WorkerMap=1

[Memory]
; The "virtual memory manager" reserves one contiguous 815 MB block of address space at startup.
; Without the Large Address Aware flag (2 GB) that often fails on modern systems, which is what
; the -novirtual command line switch works around.
; -1 = auto: off (like -novirtual) without LAA, on with LAA
;  0 = always off (-novirtual), 1 = always on
VirtualMemory=-1

; Size of the HARDWARE_SETTINGS pool (system/applicationMemoryMap.xml, 16 KB in the game).
; hardware_settings_info.xml lives there, with one node per display mode. 0 = keep the game's size.
HardwareSettingsPoolKB=256

[PostProcess]
; On-the-fly post processing tweaks for tracks/<track>/effects.xml (text and binary files),
; no game files are modified. Applies to the race, cockpit, transition and garage (menu) effects.
; Any value = keep -> leave it as the game has it.
Enable=1

; Bloom strength (bloomAmount). The game uses ~1.0-1.1. 0 = no bloom at all.
Bloom=0.30
; Yellow/orange tone (tintColour ~255,220,140 with tintAmount 0.15-0.5).
; 0 = remove (white tint), keep = as in game.
Tint=0
; Dark screen edges. 0 = off.
Vignette=0
; Brightness (engine parameter "brighness", about +0.03..0.06 on tracks).
Brightness=keep
; Contrast (~0.96-1.09), saturation ("colour", ~0.43-0.80 on tracks, 1.0 = neutral),
; final colour amount (~0.83-1.27), gamma (1.0), motion blur length (~10-20).
Contrast=keep
Saturation=keep
ColourAmount=keep
Gamma=keep
MotionBlur=keep

[Graphics]
; Track surface LOD (tracks/tracklodsettings.xml): distance in metres at which the detailed track
; surface switches to the low detail one, and the blend range. The game uses 30 / 10, which shows
; a visible "detail line" just in front of the car. 0 = keep the game's value.
SurfaceLodDistance=1000
SurfaceLodBlend=100

[PostProcessOverride]
; Any <Param> of tracks/*/effects.xml, for example:
;lumMin=0.40
;lumMax=0.80
;upperThreshold=1.0

[Video]
; Limit the video memory the game sees (MB). 0 = no limit.
; Cards with 2+ GB become a negative value in the engine's math, and the resolution gets capped
; at 1280 by <res mem="270" maxWidth="1280" /> in hardware_settings_restrictions.xml.
MaxVideoMemoryMB=1024

; D3D9 display mode filter. Kept: up to MaxResolutions resolutions (the largest ones + the desktop
; resolution), each with 60 Hz and the desktop refresh rate.
FilterModes=1
MaxResolutions=12
MinWidth=800

[Misc]
; With "Beta: Use Unicode UTF-8 for worldwide language support" enabled in Windows the game
; fails to start. 1 = the game gets ANSI code page 1252 instead of UTF-8.
FixUtf8CodePage=1
; Disable Windows DPI scaling for the game
DPIAware=1
; Write Grid_Core_Bloom_Fix.log next to the game (or to %TEMP% if the folder is read-only)
Log=1
